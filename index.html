<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #c3e6cb, #6abf69);
    }

    .outer-box {
      background: linear-gradient(135deg, #9cd68f, #4a9958);
      padding: 50px;
      border-radius: 10px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    .profile-card {
      display: flex;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      width: 380px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    /* LEFT SIDE */
    .left-side {
      flex: 1;
      text-align: center;
      padding: 25px 20px;
    }

    .left-side .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #4a9958;
      margin-bottom: 10px;
    }

    .left-side h2 {
      color: #3b7b48;
      font-size: 18px;
    }

    .role {
      color: #888;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 6px 0;
      border: 1.5px solid #4a9958;
      border-radius: 20px;
      background: transparent;
      color: #4a9958;
      font-weight: 500;
      margin: 6px 0;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #4a9958;
      color: #fff;
    }

    /* RIGHT SIDE */
    .right-side {
      width: 45%;
      background: #e8f5e9;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      padding: 20px;
    }

    .info-box {
      text-align: center;
    }

    .info-box h3 {
      color: #3b7b48;
      font-size: 18px;
      margin-bottom: 3px;
    }

    .info-box p {
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="outer-box">
    <div class="profile-card">
      <div class="left-side">
        <img src="https://via.placeholder.com/80" alt="Profile Picture" class="avatar">
        <h2>Salix Dubois</h2>
        <p class="role">Programmer</p>
        <button class="btn">Follow</button>
        <button class="btn">Message</button>
      </div>

      <div class="right-side">
        <div class="info-box">
          <h3>523</h3>
          <p>Posts</p>
        </div>
        <div class="info-box">
          <h3>1387</h3>
          <p>Likes</p>
        </div>
        <div class="info-box">
          <h3>146</h3>
          <p>Followers</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
